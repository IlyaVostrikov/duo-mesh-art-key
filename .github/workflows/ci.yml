name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Contract tests
        run: bun run test:contracts

      - name: Verifier tests
        run: bun run test:verifier

      - name: Webapp client tests
        run: bun run test:webapp

      - name: Backend tests
        run: bun run test:backend

      - name: Check serverless bundle freshness
        run: |
          bun run --cwd backend prisma:generate
          bundle_snapshot="${RUNNER_TEMP}/duo-mesh-api-index.js"
          cp backend/api/index.js "$bundle_snapshot"
          bun run backend/scripts/build-vercel.mjs
          if ! diff -q "$bundle_snapshot" backend/api/index.js; then
            echo "ERROR: Committed serverless bundle (backend/api/index.js) is out of date."
            echo "Run: bun run backend/scripts/build-vercel.mjs"
            echo "Then commit the regenerated bundle."
            exit 1
          fi
          echo "Serverless bundle is up to date."

      - name: Install Playwright browser
        run: bun run --cwd webapp e2e:install

      - name: Webapp E2E smoke
        run: bun run e2e:webapp
